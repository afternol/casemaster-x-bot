# ケース面接で頻出のフレームワーク一覧

- name: 3C分析
  description: Customer（顧客）・Competitor（競合）・Company（自社）の3視点で事業環境を整理する。戦略立案の最初の一手として使われることが多い。

- name: 4P分析
  description: Product・Price・Place・Promotionの4要素でマーケティング戦略を整理する。「売上が落ちている」系のケースで現状分析に使いやすい。

- name: MECE
  description: Mutually Exclusive Collectively Exhaustiveの略。漏れなくダブりなく情報を整理する考え方。ロジックツリーやイシュー分解の基礎となる概念。

- name: ロジックツリー
  description: 問題を「なぜ？」「どうすれば？」で木構造に分解していく手法。原因分析（Why So）と解決策探索（How So）の2種類がある。

- name: イシューツリー
  description: 解くべき問い（イシュー）を分解して構造化するツール。ケース面接では最初に「何を解けば答えが出るか」を整理するために使う。

- name: 収益構造分解
  description: 売上＝価格×数量、利益＝売上−コスト と分解していく基本フレーム。「利益改善」「売上向上」ケースの最初のアプローチ。

- name: バリューチェーン分析
  description: 企業活動を調達→製造→物流→販売→サービスなどの工程に分解し、価値創造とコストを把握する。製造業・小売業のケースで特に有効。

- name: ポーターの5フォース
  description: 業界の収益性を左右する「新規参入・代替品・買い手・売り手・業界内競争」の5つの力を分析する。業界分析・新規参入ケースで使う。

- name: BCGマトリクス
  description: 市場成長率と市場シェアで事業を「花形・金のなる木・問題児・負け犬」に分類するフレーム。ポートフォリオ戦略ケースで登場する。

- name: SWOT分析
  description: Strengths・Weaknesses・Opportunities・Threatsの4軸で企業の内外環境を整理する。網羅的な現状把握に向くが、深さが出にくい点に注意。

- name: STP分析
  description: Segmentation（市場細分化）・Targeting（ターゲット設定）・Positioning（ポジション確立）の3ステップ。新規参入・ブランド戦略ケースで使う。

- name: コスト構造分解
  description: コストを固定費と変動費、または直接費と間接費に分解して分析する。コスト削減ケースでは必ず使う基本的な手法。

- name: 需要・供給分析
  description: 需要サイド（顧客の変化）と供給サイド（競合・自社）の両面から市場変化を読み解く手法。「市場が縮小している理由を分析せよ」系のケースで有効。

- name: ビジネスモデル分解
  description: 誰に・何を・いくらで・どのように提供するかを構造化する。新規事業立案ケースで「何で稼ぐか」を整理するのに使う。

- name: 優先順位マトリクス
  description: 施策を「インパクト大×実現性高」などの2軸でプロットし、優先度を決める手法。複数の解決策が出た後の絞り込みに使う。
