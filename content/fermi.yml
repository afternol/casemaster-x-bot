# フェルミ推定練習問題集

- question: 日本国内のコンビニの総店舗数は？
  hint: 人口・地域密度・来店頻度などから分解できる

- question: 東京都内を走るタクシーの総台数は？
  hint: 需要サイド（需要×稼働率）と供給サイドの両面から推計できる

- question: 日本で1日に消費されるペットボトル飲料の本数は？
  hint: 人口×飲用頻度で積み上げる方法と、生産量からのトップダウンが使える

- question: 日本全国の自動販売機の総台数は？
  hint: 設置場所の種類（オフィス・駅・学校・公道）ごとに分類して積み上げる

- question: 渋谷スクランブル交差点を1日に渡る人の数は？
  hint: 時間帯ごとの人流 × 営業時間で推計できる

- question: 日本の美容院の総店舗数は？
  hint: 人口×利用頻度÷1店舗あたりの処理能力で推計できる

- question: 東京－大阪間の新幹線の年間乗客数は？
  hint: 1本あたりの定員×1日の本数×平均乗車率×365日

- question: 日本で毎年捨てられる傘の総本数は？
  hint: 人口×傘の保有数×廃棄率で推計できる

- question: 日本国内にあるエレベーターの総台数は？
  hint: 建物の種類（オフィス・マンション・商業施設）ごとに積み上げる

- question: 世界で1日に撮影される写真の枚数は？
  hint: スマートフォン保有者数×1人あたりの撮影枚数から推計できる

- question: 日本の中学・高校で使われる鉛筆の年間本数は？
  hint: 生徒数×1人が1年で使う鉛筆の本数で積み上げる

- question: 東京23区内のATMの総台数は？
  hint: 銀行・コンビニ・商業施設の設置台数を分けて推計する

- question: 日本で1年間に食べられるラーメンの杯数は？
  hint: 人口×頻度（外食＋袋麺）で推計できる

- question: 日本全国の理・美容師の総人数は？
  hint: 店舗数×1店舗あたりのスタッフ数で推計できる

- question: スマートフォンの充電ケーブルは日本に何本存在するか？
  hint: スマホ保有台数×1台あたりの平均ケーブル本数で積み上げる
