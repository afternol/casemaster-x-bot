name: Daily Schedule

on:
  schedule:
    # 今日（JST）の投稿を作る。同じ日の分があれば作らない（count_valid_rows）ので複数回試しても1日1件
    # 2,5,8 UTC = 11:17 / 14:17 / 17:17 JST（混雑する0分・30分を避ける）
    - cron: '17 2,5,8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（DB登録しない）'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

# keepalive ステップが .keepalive をコミットするため contents: write が必要
permissions:
  contents: write

concurrency:
  group: daily-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scheduler.py --dry
          else
            python scheduler.py
          fi
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SITE_URL:             ${{ secrets.SITE_URL }}
          # X APIキーはスケジューラでは不要だが念のため渡す
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      # GitHub は 60 日間リポジトリに活動がないと scheduled workflow を自動無効化する。
      # 最終コミットが 30 日以上前なら .keepalive を更新してコミットする（月1回程度）。
      # - scheduler が失敗しても実行する（if: always()）
      # - GITHUB_TOKEN による push は新たなワークフロー実行を起動しない。
      #   さらに本リポジトリに push トリガーのワークフローは無いのでループしない。
      - name: Keepalive (prevent 60-day auto-disable)
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "last commit: ${age_days} days ago"
          if [ "$age_days" -lt 30 ]; then
            echo "keepalive not needed"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
