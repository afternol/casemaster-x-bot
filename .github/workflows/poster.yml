name: Post Queue

on:
  schedule:
    # 30分ごとに実行（投稿は20:00 JST の1件のみ。対象がなければ即終了）
    # 1回の実行で最大1件・予定から3時間超過した pending は投稿せず failed にする
    # GitHub の schedule は毎時0分・30分など混雑時刻ほど遅延・欠落しやすい。投稿時刻（20:00 JST）以降に半端な分で複数回試す
    # 11-14 UTC = 20-23 JST。投稿は「時刻を過ぎた pending」だけなので何回起動しても重複しない
    - cron: '7,23,41,53 11,12,13,14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（X投稿しない）'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

# 手動実行と定期実行が重なっても同じ行を二重投稿しないよう直列化
concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poster
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python poster.py --dry
          else
            python poster.py
          fi
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
